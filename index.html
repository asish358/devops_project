<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScaleShield</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#16213a;--mut:#6b7691;--line:#e3e8f2;--pri:#4f46e5;--ok:#0f9d78;--warn:#d97706;--bad:#dc2626;--blue:#2563eb;}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1424;--card:#171e33;--ink:#e8ecf8;--mut:#93a0bf;--line:#26304d;--pri:#818cf8;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--blue:#60a5fa}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,Segoe UI,Arial,sans-serif;display:flex;min-height:100vh}
aside{width:224px;background:var(--card);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700}
.brand b{display:block;font-size:15px}.brand small{color:var(--mut);font-size:11px}
.lbl{font-size:10px;letter-spacing:.08em;color:var(--mut);padding:8px 10px 4px}
aside a{display:block;padding:8px 10px;border-radius:8px;color:var(--mut);text-decoration:none;font-weight:500}
aside a.on{background:color-mix(in srgb,var(--pri) 14%,transparent);color:var(--pri)}
.eng{margin-top:auto;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px}
.eng i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
main{flex:1;min-width:0;padding:20px 26px}
.top{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--mut)}
.chip.ok{color:var(--ok)}.sp{flex:1}
h1{font-size:22px;margin:0}.sub{color:var(--mut);margin:2px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 2px;font-size:14px}.card p.s{margin:0 0 12px;color:var(--mut);font-size:12px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.kpi .v{font-size:26px;font-weight:700}.kpi .t{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}.kpi .n{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse}th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);font-size:13px}tr:last-child td{border:0}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:600}
.b-ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}.b-bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.b-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}.b-pri{background:color-mix(in srgb,var(--pri) 15%,transparent);color:var(--pri)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:6px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px}
.btn.o{background:transparent;color:var(--ink);border:1px solid var(--line)}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:4px}.field input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}.field small{color:var(--mut);font-size:11px}
.rep{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.rep>div{border:1px solid var(--line);border-radius:10px;padding:10px}
svg text{fill:var(--mut);font-size:11px}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
@media(max-width:820px){body{flex-direction:column}aside{width:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.brand,.lbl,.eng{display:none}aside a{white-space:nowrap}.g4,.g3,.g2{grid-template-columns:1fr 1fr}main{padding:14px 16px}}
@media(max-width:520px){.g4,.g3,.g2,.rep{grid-template-columns:1fr}}
</style>
</head>
<body>
<aside id="nav"></aside>
<main id="app"></main>
<script>
const pages=[['overview','Overview'],['replicas','Replicas'],['monitoring','Live Monitoring'],['policies','Scaling Policies'],['events','Scaling Events'],['incidents','Self-Healing Incidents'],['audit','Audit Logs'],['settings','Settings & Load Test']];
// deterministic series
const N=40;
const cpu=Array.from({length:N},(_,i)=>{const t=i/N;return Math.round(34+ (t>.35? 36*Math.min(1,(t-.35)/.25):0)+ 3*Math.sin(i*1.7))});
const rps=cpu.map((c,i)=>Math.round(c*5.6+14*Math.sin(i*2.3)));
const lat=cpu.map((c,i)=>Math.round(90+ Math.max(0,c-55)*5.2+8*Math.sin(i*1.1)));
const p95=lat.map((l,i)=>Math.round(l*1.7+10*Math.sin(i*.9)));
const mem=cpu.map((c,i)=>Math.round(44+c*.28+2*Math.sin(i)));
const reps=cpu.map((c,i)=>{const t=i/N;return t<.45?2:t<.65?3:4});
function line(series,colors,{h=190,w=560,max,unit='',step=false}={}){
  const m=max||Math.max(...series.flat())*1.15,pad=34,iw=w-pad-8,ih=h-26;
  const x=i=>pad+i*iw/(N-1),y=v=>8+ih-(v/m)*ih;
  let g='';for(let k=0;k<=4;k++){const v=m*k/4,yy=y(v);g+=`<line x1="${pad}" x2="${w-8}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${pad-6}" y="${yy+4}" text-anchor="end">${Math.round(v)}${unit}</text>`}
  let p='';series.forEach((s,si)=>{let d='';s.forEach((v,i)=>{d+=(i?(step?`H${x(i)}V${y(v)}`:`L${x(i)},${y(v)}`):`M${x(i)},${y(v)}`)});p+=`<path d="${d}" fill="none" stroke="${colors[si]}" stroke-width="2.2" stroke-linejoin="round"/>`});
  const xs=['10:00','10:10','10:20','10:30'].map((t,k)=>`<text x="${pad+k*iw/3}" y="${h-4}" text-anchor="${k==3?'end':k?'middle':'start'}">${t}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">${g}${p}${xs}</svg>`}
function th(v,lim,u){return `<line/>`}
const badge=(t,c)=>`<span class="badge b-${c}">${t}</span>`;
const head=(t,s,btn)=>`<div style="display:flex;align-items:flex-start;gap:12px"><div style="flex:1"><h1>${t}</h1><p class="sub">${s}</p></div>${btn?`<button class="btn">${btn}</button>`:''}</div>`;
const card=(t,s,b)=>`<div class="card"><h3>${t}</h3><p class="s">${s}</p>${b}</div>`;
const kpi=(t,v,n)=>`<div class="card kpi" style="margin:0"><div class="t">${t}</div><div class="v">${v}</div><div class="n">${n}</div></div>`;
const legend=a=>`<div class="leg">${a.map(([c,t])=>`<span><i style="background:${c}"></i>${t}</span>`).join('')}</div>`;
const replicaRows=[['web-app-1','Healthy',31,'210 MB',112,'4h 12m'],['web-app-2','Healthy',36,'224 MB',118,'4h 12m'],['web-app-3','Healthy',29,'205 MB',109,'1h 40m'],['web-app-4','Restarting',0,'—','—','8s']];
const P={
overview:()=>head('Service Overview','Monitor replicas, load, and automated recovery for web-app','New Policy')+
 `<div class="grid g4" style="margin-bottom:14px">${kpi('Running replicas','3 / 6','min 2 · max 6 · 1 starting')}${kpi('Avg CPU','68%','target 60%')}${kpi('Requests / sec','412','across all replicas')}${kpi('Self-heal events (24h)','5','all recovered')}</div>
 <div class="grid g2">${card('CPU Utilization (%)','Average across replicas · target 60%',line([cpu],['var(--pri)'],{max:100,unit:'%'}))}
 ${card('Replica Count','Scale-out and scale-in over time',line([reps],['var(--ok)'],{max:6,step:true})+legend([['var(--ok)','Running replicas']]))}</div>
 ${card('Replica Status','Current replicas behind the load balancer',`<div class="rep">${replicaRows.slice(0,3).map(r=>`<div><b>${r[0]}</b><div style="margin:6px 0">${badge(r[1],'ok')}</div><div class="bar"><i style="width:${r[2]}%;background:var(--pri)"></i></div><small style="color:var(--mut)">CPU ${r[2]}%</small></div>`).join('')}<div><b>web-app-4</b><div style="margin:6px 0">${badge('Starting','warn')}</div><div class="bar"><i style="width:8%;background:var(--warn)"></i></div><small style="color:var(--mut)">Joining pool</small></div></div>`)}`,
replicas:()=>head('Replicas','Containers currently managed for web-app','Scale Manually')+
 card('Replica List','Health is checked every 5 seconds',`<table><tr><th>Replica</th><th>Status</th><th>CPU</th><th>Memory</th><th>Avg latency</th><th>Uptime</th><th>Action</th></tr>${[['web-app-1','Healthy',31,'210 MB','112 ms','4h 12m'],['web-app-2','Healthy',36,'224 MB','118 ms','4h 12m'],['web-app-3','Healthy',29,'205 MB','109 ms','1h 40m'],['web-app-4','Starting',8,'96 MB','—','8s']].map(r=>`<tr><td class="mono">${r[0]}</td><td>${badge(r[1],r[1]=='Healthy'?'ok':'warn')}</td><td>${r[2]}%</td><td>${r[3]}</td><td>${r[5]=='8s'?'—':r[4]}</td><td>${r[5]}</td><td><span class="badge b-pri">Restart</span></td></tr>`).join('')}</table>`)+
 `<div class="grid g3">${card('Load Balancer','Nginx · round robin','<div class="mono">upstream web_app {<br>&nbsp;server web-app-1:8000;<br>&nbsp;server web-app-2:8000;<br>&nbsp;server web-app-3:8000;<br>}</div>')}${card('Replica Limits','Configured bounds','<div class="mono">min = 2<br>max = 6<br>current = 4</div>')}${card('Last Action','Most recent scaling decision',`${badge('SCALE OUT','ok')}<p style="margin:8px 0 0">3 → 4 replicas at 10:24:18<br><span style="color:var(--mut)">CPU 78% above 70% for 3 samples</span></p>`)}</div>`,
monitoring:()=>head('Live Monitoring','CPU, memory, traffic, and latency for web-app','Refresh')+
 `<div class="grid g2">${card('CPU Utilization (%)','Scale-out threshold 70% · scale-in threshold 30%',line([cpu],['var(--pri)'],{max:100,unit:'%'})+legend([['var(--pri)','Average CPU']]))}
 ${card('Memory Usage (%)','Average across replicas',line([mem],['var(--blue)'],{max:100,unit:'%'})+legend([['var(--blue)','Memory']]))}
 ${card('Request Rate (req/s)','Traffic reaching the load balancer',line([rps],['var(--ok)'],{unit:''})+legend([['var(--ok)','Requests per second']]))}
 ${card('Response Latency (ms)','Average and p95 latency',line([lat,p95],['var(--warn)','var(--bad)'],{unit:''})+legend([['var(--warn)','Average'],['var(--bad)','p95']]))}</div>`,
policies:()=>head('Scaling Policies','Thresholds, limits, and health-check settings for web-app')+
 card('1. Scaling Thresholds','Deterministic evaluation',`<div class="grid g3">${[['Scale-out CPU (%)',70,'Add a replica above this CPU'],['Scale-in CPU (%)',30,'Remove a replica below this CPU'],['Consecutive samples',3,'Breaches needed before action']].map(f=>`<div class="field"><label>${f[0]}</label><input value="${f[1]}"><small>${f[2]}</small></div>`).join('')}</div>`)+
 card('2. Replica Limits & Cooldown','Prevents oscillation',`<div class="grid g3">${[['Minimum replicas',2,'Never go below this'],['Maximum replicas',6,'Never exceed this'],['Cooldown (seconds)',60,'Wait between scaling actions']].map(f=>`<div class="field"><label>${f[0]}</label><input value="${f[1]}"><small>${f[2]}</small></div>`).join('')}</div>`)+
 card('3. Health Checks & Self-Healing','Automatic recovery',`<div class="grid g3">${[['Health endpoint','/health','Probed on each replica'],['Check interval (s)',5,'Seconds between probes'],['Failure threshold',3,'Failed probes before restart']].map(f=>`<div class="field"><label>${f[0]}</label><input value="${f[1]}"><small>${f[2]}</small></div>`).join('')}</div>`)+
 `<div style="text-align:right"><button class="btn o">Restore Defaults</button> <button class="btn">Save Policies</button></div>`,
events:()=>head('Scaling Events','History of automatic scale-out and scale-in decisions')+
 card('Event History','Every decision made by the engine',`<table><tr><th>Time</th><th>Action</th><th>Replicas</th><th>Trigger</th><th>Result</th></tr>${[['10:26:18','SCALE OUT','3 → 4','CPU 78% above 70% for 3 samples','ok'],['10:21:44','NO ACTION','3','Cooldown active (42 s left)','pri'],['10:17:40','SCALE OUT','2 → 3','CPU 74% above 70% for 3 samples','ok'],['10:09:05','NO ACTION','2','CPU within 30–70% band','pri'],['10:01:12','NO ACTION','2','CPU within 30–70% band','pri'],['09:54:40','NO ACTION','2','Initial replica count applied','pri']].map(r=>`<tr><td class="mono">${r[0]}</td><td>${badge(r[1],r[4])}</td><td>${r[2]}</td><td>${r[3]}</td><td>${badge('Applied','ok')}</td></tr>`).join('')}</table>`)+
 card('Replica Count','Replicas over the last 30 minutes',`<div style="max-width:600px">${line([reps],['var(--ok)'],{max:6,step:true})}</div>`)
,
incidents:()=>head('Self-Healing Incidents','Container failures detected and recovered automatically')+
 card('Automated Recovery Cycle','5-step guarantee',`<div class="grid" style="grid-template-columns:repeat(5,1fr)">${[['Failure detected','3 failed probes'],['Replica removed','Out of load balancer'],['Container restarted','Docker SDK'],['Health verified','/health returned 200'],['Replica restored','Back in pool']].map((s,i)=>`<div style="border:1px solid var(--line);border-radius:10px;padding:10px"><small style="color:var(--mut)">STEP ${i+1}</small><br><b>${s[0]}</b><br><small style="color:var(--mut)">${s[1]}</small></div>`).join('')}</div>`)+
 card('Incident Log','Most recent first',`<table><tr><th>Incident</th><th>Severity</th><th>Replica</th><th>Cause</th><th>Recovery time</th><th>Status</th></tr>${[['INC-5','MEDIUM','web-app-2','Container stopped','6.2 s'],['INC-4','HIGH','web-app-1','Health check timeout','9.8 s'],['INC-3','MEDIUM','web-app-3','Container crashed (exit 137)','7.4 s'],['INC-2','LOW','web-app-2','Slow response > 500 ms','4.1 s'],['INC-1','MEDIUM','web-app-1','Container stopped','6.9 s']].map(r=>`<tr><td class="mono">${r[0]}</td><td>${badge(r[1],r[1]=='HIGH'?'bad':r[1]=='MEDIUM'?'warn':'pri')}</td><td class="mono">${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${badge('Resolved','ok')}</td></tr>`).join('')}</table>`),
audit:()=>head('Audit Logs','Traceable record of scaling decisions, recoveries, and user actions','Refresh Logs')+
 card('Audit Trail','All actors',`<table><tr><th>ID</th><th>Time</th><th>Actor</th><th>Action</th><th>Target</th><th>Details</th></tr>${[['#9','10:26:18','ScalingEngine','SCALE_OUT','web-app','Replicas 3 → 4 (CPU 78%)'],['#8','10:22:20','SelfHealer','REPLICA_RESTART','web-app-2','Container stopped; restart verified'],['#7','10:17:40','ScalingEngine','SCALE_OUT','web-app','Replicas 2 → 3 (CPU 74%)'],['#6','10:12:03','Operator','POLICY_UPDATE','web-app','Cooldown 90 s → 60 s'],['#5','10:08:15','SelfHealer','REPLICA_RESTART','web-app-1','Health timeout; restart verified'],['#4','09:57:30','Operator','SCALE_MANUAL','web-app','Replica limit max set to 6'],['#3','09:55:21','ServiceCatalog','SERVICE_REGISTERED','web-app','Registered with 2 replicas'],['#2','09:54:52','ScalingEngine','POLICY_LOADED','web-app','Default scaling policy applied'],['#1','09:54:40','SystemBootstrap','INITIAL_SEED','Platform','Initial configuration loaded']].map(r=>`<tr><td class="mono">${r[0]}</td><td class="mono">${r[1]}</td><td>${badge(r[2],r[2]=='Operator'?'warn':'pri')}</td><td class="mono">${r[3]}</td><td class="mono">${r[4]}</td><td>${r[5]}</td></tr>`).join('')}</table>`),
settings:()=>head('Settings & Load Test','Environment details and failure / load simulation')+
 card('Load & Failure Simulation','Trigger scenarios to watch scaling and self-healing react',`<div class="grid g4">${[['Generate High Load','Sends 500 req/s for 2 minutes to raise CPU','warn'],['Generate Low Load','Reduces traffic to trigger scale-in','pri'],['Stop a Replica','Stops one container to test self-healing','bad'],['Break Health Check','Makes /health return 503','bad']].map(s=>`<div style="border:1px solid var(--line);border-radius:10px;padding:12px"><b>${s[0]}</b><p style="color:var(--mut);font-size:12px;margin:4px 0 10px">${s[1]}</p>${badge('Run','' +s[2])}</div>`).join('')}</div>`)+
 card('System Environment','Architecture specifications',`<table>${[['FastAPI backend','http://localhost:8000'],['Sample application replicas','http://localhost:8001 – 8006'],['Nginx load balancer','http://localhost:8080'],['Database','SQLite (local) / PostgreSQL (container)'],['Decision engine','Deterministic rules (autonomous)'],['Container control','Docker SDK for Python']].map(r=>`<tr><td>${r[0]}</td><td class="mono" style="text-align:right">${r[1]}</td></tr>`).join('')}</table>`)
};
function render(){
  const k=(location.hash||'#overview').slice(1);const key=P[k]?k:'overview';
  document.getElementById('nav').innerHTML=`<div class="brand"><div class="logo">S</div><div><b>ScaleShield</b><small>Auto-scaling &amp; self-healing</small></div></div><div class="lbl">PLATFORM MODULES</div>`+pages.map(([id,t])=>`<a href="#${id}" class="${id==key?'on':''}">${t}</a>`).join('')+`<div class="eng"><i></i><b>Scaling Engine</b> ONLINE<br><span style="color:var(--mut)">Evaluating metrics every 5 s</span></div>`;
  document.getElementById('app').innerHTML=`<div class="top"><span class="chip">ScaleShield</span><span class="chip">web-app</span><span class="chip">All Environments</span><span class="sp"></span><span class="chip ok">● Engine: Running</span><span class="chip ok">● Metrics Normal</span></div>`+P[key]();
  document.title='ScaleShield';
}
addEventListener('hashchange',render);render();
</script>
</body>
</html>
